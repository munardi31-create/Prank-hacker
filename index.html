<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRITICAL SECURITY SYSTEM</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#00ff41;
    font-family:Consolas,monospace;
    overflow:hidden;
}

body{
    animation:screenShake 0s;
}

#boot{
    width:100%;
    height:100%;
    padding:18px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.header{
    color:#ff1111;
    text-align:center;
    font-size:clamp(22px,6vw,50px);
    font-weight:bold;
    text-shadow:0 0 20px red;
    animation:blink .25s infinite;
}

.warning{
    text-align:center;
    color:#fff;
    margin:10px 0 20px;
    font-size:14px;
}

#terminal{
    height:260px;
    overflow:hidden;
    border:1px solid #003b12;
    padding:12px;
    box-shadow:0 0 15px #003b12 inset;
    font-size:14px;
    line-height:1.6;
}

.red{
    color:#ff2222;
}

.yellow{
    color:#ffff00;
}

.white{
    color:white;
}

.progressBox{
    margin-top:18px;
    border:2px solid #00ff41;
    height:25px;
}

#progress{
    width:0%;
    height:100%;
    background:#00ff41;
    box-shadow:0 0 15px #00ff41;
    transition:.15s;
}

#percent{
    text-align:center;
    margin-top:8px;
}

#countdown{
    display:none;
    text-align:center;
    color:red;
    font-size:clamp(90px,25vw,180px);
    font-weight:bold;
    text-shadow:0 0 30px red;
    animation:pulse .25s infinite;
}

#critical{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

.criticalTitle{
    color:red;
    font-size:clamp(30px,9vw,70px);
    font-weight:bold;
    animation:blink .18s infinite;
}

.skull{
    font-size:clamp(70px,20vw,160px);
    animation:shake .06s infinite;
}

#fakeFiles{
    color:#ff3333;
    line-height:1.8;
    font-size:14px;
}

#ending{
    display:none;
    position:fixed;
    inset:0;
    background:#000;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    font-family:Arial,sans-serif;
}

#ending h1{
    color:#00ff41;
    font-size:clamp(40px,12vw,90px);
    margin:10px;
}

#ending p{
    color:white;
    font-size:18px;
}

@keyframes blink{
    50%{opacity:.08;}
}

@keyframes pulse{
    50%{transform:scale(1.12);}
}

@keyframes shake{
    0%{transform:translate(5px,3px);}
    25%{transform:translate(-5px,-4px);}
    50%{transform:translate(4px,-5px);}
    75%{transform:translate(-4px,4px);}
    100%{transform:translate(3px,-3px);}
}
</style>
</head>

<body>

<div id="boot">

    <div class="header">
        ⚠ CRITICAL SECURITY ALERT ⚠
    </div>

    <div class="warning">
        SYSTEM INTEGRITY CHECK FAILED
    </div>

    <div id="terminal"></div>

    <div class="progressBox">
        <div id="progress"></div>
    </div>

    <div id="percent">
        SECURITY ANALYSIS: 0%
    </div>

    <div id="countdown">
        15
    </div>

</div>


<!-- MODE CRITICAL -->

<div id="critical">

    <div class="skull">☠️</div>

    <div class="criticalTitle">
        SYSTEM LOCKDOWN
    </div>

    <p class="white">
        CRITICAL SECURITY FAILURE
    </p>

    <div id="fakeFiles"></div>

</div>


<!-- ENDING -->

<div id="ending">

    <div style="font-size:100px">
        😂
    </div>

    <h1>
        KENA PRANK!
    </h1>

    <p>
        Santai bro... HP kamu AMAN 😎
    </p>

    <p>
        Tidak ada data yang diambil.
    </p>

    <p>
        Tidak ada file yang dihapus.
    </p>

    <p>
        Tidak ada akun yang diretas.
    </p>

    <p>
        Cuma simulasi hacker 🤣
    </p>

</div>


<script>

/* =========================
   TERMINAL SIMULATION
========================= */

const terminal =
document.getElementById("terminal");

const messages = [

"> Starting secure boot...",
"> Loading security module...",
"> Checking system integrity...",
"> Verifying device environment...",
"> Scanning active processes...",
"> Checking network security...",
"> Firewall detected...",
"> Firewall response: WARNING",
"> Running secondary security scan...",
"> Suspicious activity detected!",
"> Attempting emergency protection...",
"> Protection module unstable!",
"> Isolating virtual environment...",
"> Generating emergency report...",
"> CRITICAL ERROR DETECTED!",
"> Security level: EXTREME"

];

let index = 0;

const terminalLoop =
setInterval(()=>{

    if(index >= messages.length){

        clearInterval(terminalLoop);

        return;
    }

    let text = messages[index];

    if(
        text.includes("WARNING") ||
        text.includes("Suspicious") ||
        text.includes("CRITICAL") ||
        text.includes("unstable")
    ){

        terminal.innerHTML +=
        "<span class='red'>" +
        text +
        "</span><br>";

    }else{

        terminal.innerHTML +=
        text + "<br>";

    }

    terminal.scrollTop =
    terminal.scrollHeight;

    index++;

},550);


/* =========================
   PROGRESS
========================= */

let percentage = 0;

const progress =
document.getElementById("progress");

const percent =
document.getElementById("percent");

const scan =
setInterval(()=>{

    percentage +=
    Math.floor(Math.random()*5)+1;

    if(percentage >= 100){

        percentage = 100;

        clearInterval(scan);

        setTimeout(
            beginCountdown,
            1000
        );
    }

    progress.style.width =
    percentage + "%";

    percent.innerText =
    "SECURITY ANALYSIS: " +
    percentage + "%";

},250);


/* =========================
   COUNTDOWN
========================= */

function beginCountdown(){

    terminal.style.display="none";
    document.querySelector(".progressBox")
    .style.display="none";

    percent.style.display="none";

    const countdown =
    document.getElementById("countdown");

    countdown.style.display="block";

    let number = 15;

    countdown.innerText = number;

    playAlarm();

    const timer =
    setInterval(()=>{

        number--;

        countdown.innerText =
        number;

        if(number <= 0){

            clearInterval(timer);

            showCritical();

        }

    },900);
}


/* =========================
   ALARM
========================= */

function playAlarm(){

    try{

        const audio =
        new AudioContext();

        let count = 0;

        const alarm =
        setInterval(()=>{

            const oscillator =
            audio.createOscillator();

            const gain =
            audio.createGain();

            oscillator.frequency.value =
            count % 2 === 0 ? 900 : 450;

            gain.gain.value=.08;

            oscillator.connect(gain);

            gain.connect(
                audio.destination
            );

            oscillator.start();

            oscillator.stop(
                audio.currentTime + .12
            );

            count++;

            if(count > 20){
                clearInterval(alarm);
            }

        },250);

    }catch(error){

        /* Audio mungkin diblokir browser */

    }
}


/* =========================
   CRITICAL SCREEN
========================= */

function showCritical(){

    document.getElementById("boot")
    .style.display="none";

    const critical =
    document.getElementById("critical");

    critical.style.display="flex";

    if(navigator.vibrate){

        navigator.vibrate([
            200,80,
            200,80,
            400,100,
            300
        ]);

    }

    const files =
    document.getElementById("fakeFiles");

    const fakeList = [

        "[SIMULATION] system_check.log",
        "[SIMULATION] security_report.dat",
        "[SIMULATION] virtual_scan.tmp",
        "[SIMULATION] emergency_protocol.sys",
        "[SIMULATION] firewall_status.log"

    ];

    let i=0;

    const fileLoop =
    setInterval(()=>{

        if(i >= fakeList.length){

            clearInterval(fileLoop);

            setTimeout(
                showEnding,
                3000
            );

            return;
        }

        files.innerHTML +=
        fakeList[i] + "<br>";

        i++;

    },450);
}


/* =========================
   ENDING
========================= */

function showEnding(){

    document.getElementById("critical")
    .style.display="none";

    document.getElementById("ending")
    .style.display="flex";

    if(navigator.vibrate){

        navigator.vibrate(0);

    }
}

</script>

</body>
</html>
