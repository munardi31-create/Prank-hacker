
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRITICAL SYSTEM ALERT</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#00ff41;
  font-family:monospace;
}

#main{
  width:100%;
  height:100%;
  padding:22px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.warning{
  text-align:center;
  color:#ff1111;
  font-size:clamp(24px,7vw,55px);
  font-weight:bold;
  animation:danger .22s infinite;
  text-shadow:0 0 15px red;
}

.sub{
  text-align:center;
  color:#fff;
  margin-top:10px;
  font-size:14px;
}

#terminal{
  margin-top:25px;
  height:230px;
  overflow:hidden;
  line-height:1.55;
  font-size:clamp(12px,3.5vw,17px);
}

.red{color:red}
.yellow{color:#ffff00}

.progress{
  width:100%;
  height:26px;
  border:2px solid #00ff41;
  box-shadow:0 0 12px #00ff41;
}

#bar{
  width:0%;
  height:100%;
  background:#00ff41;
  transition:.12s;
}

#percent{
  text-align:center;
  margin-top:10px;
}

#countdown{
  display:none;
  text-align:center;
  color:red;
  font-size:clamp(90px,25vw,180px);
  font-weight:bold;
  text-shadow:0 0 35px red;
  animation:pulse .3s infinite;
}

#boss{
  display:none;
  position:absolute;
  inset:0;
  background:#000;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

#boss h1{
  color:red;
  font-family:Arial,sans-serif;
  font-size:clamp(42px,12vw,100px);
  margin:0;
  animation:shake .07s infinite;
}

#boss .face{
  font-size:clamp(70px,20vw,160px);
}

#final{
  display:none;
  position:absolute;
  inset:0;
  background:#000;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  font-family:Arial,sans-serif;
}

#final h1{
  font-size:clamp(40px,12vw,80px);
  margin:10px;
}

#final p{
  color:white;
  font-size:18px;
}

@keyframes danger{
  50%{opacity:.15}
}

@keyframes pulse{
  50%{transform:scale(1.12)}
}

@keyframes shake{
  0%{transform:translate(5px,3px)}
  25%{transform:translate(-5px,-3px)}
  50%{transform:translate(4px,-4px)}
  75%{transform:translate(-4px,4px)}
  100%{transform:translate(3px,-3px)}
}
</style>
</head>

<body>

<div id="main">

  <div class="warning">
    ⚠ CRITICAL SYSTEM ALERT ⚠
  </div>

  <div class="sub">
    UNAUTHORIZED ACCESS DETECTED
  </div>

  <div id="terminal"></div>

  <div class="progress">
    <div id="bar"></div>
  </div>

  <div id="percent">
    SYSTEM ANALYSIS: 0%
  </div>

  <div id="countdown">
    10
  </div>

</div>

<!-- FINAL BOSS -->
<div id="boss">
  <div class="face">☠️</div>
  <h1>SYSTEM LOCKED</h1>
  <p style="color:white">EMERGENCY SHUTDOWN IN PROGRESS</p>
</div>

<!-- ENDING -->
<div id="final">
  <div style="font-size:100px">😂</div>
  <h1>FINAL BOSS!</h1>
  <p>Tenang bro... <b>INI CUMA PRANK!</b></p>
  <p>HP kamu aman. Tidak ada data yang diambil.</p>
  <p>😎🎮</p>
</div>


<script>

const terminal =
document.getElementById("terminal");

const bar =
document.getElementById("bar");

const percent =
document.getElementById("percent");

const countdown =
document.getElementById("countdown");

const boss =
document.getElementById("boss");

const final =
document.getElementById("final");


const messages = [
  "> Initializing security system...",
  "> Scanning virtual environment...",
  "> Checking system integrity...",
  "> WARNING: abnormal activity detected!",
  "> Firewall response: FAILED",
  "> Emergency security protocol activated...",
  "> Isolating simulated system...",
  "> Critical alert level: MAXIMUM",
  "> Preparing emergency shutdown..."
];

let messageIndex = 0;

const typing = setInterval(() => {

  if(messageIndex < messages.length){

    let text = messages[messageIndex];

    if(text.includes("WARNING") ||
       text.includes("FAILED") ||
       text.includes("Critical")){

      terminal.innerHTML +=
      "<span class='red'>" +
      text +
      "</span><br>";

    }else{

      terminal.innerHTML +=
      text + "<br>";

    }

    messageIndex++;

    terminal.scrollTop =
    terminal.scrollHeight;

  }else{

    clearInterval(typing);

  }

},500);


/* Progress palsu */

let progress = 0;

const scan = setInterval(() => {

  progress +=
  Math.floor(Math.random()*7)+2;

  if(progress >= 100){

    progress = 100;

    clearInterval(scan);

    setTimeout(startCountdown,700);
  }

  bar.style.width =
  progress + "%";

  percent.innerText =
  "SYSTEM ANALYSIS: " +
  progress + "%";

},300);


/* Countdown */

function startCountdown(){

  terminal.style.display="none";
  document.querySelector(".progress")
  .style.display="none";

  percent.style.display="none";

  countdown.style.display="block";

  let number = 10;

  countdown.innerText = number;

  /*
   Efek suara menggunakan Web Audio.
   Tidak mengakses microphone.
  */

  let audio;

  try{

    audio = new AudioContext();

  }catch(e){}


  const timer = setInterval(() => {

    number--;

    countdown.innerText =
    number;

    if(audio){

      const oscillator =
      audio.createOscillator();

      const gain =
      audio.createGain();

      oscillator.frequency.value =
      number <= 3 ? 1000 : 600;

      gain.gain.value=.08;

      oscillator.connect(gain);
      gain.connect(audio.destination);

      oscillator.start();

      oscillator.stop(
        audio.currentTime + .12
      );

    }

    if(number <= 0){

      clearInterval(timer);

      showBoss();

    }

  },900);
}


/* FINAL BOSS */

function showBoss(){

  document.getElementById("main")
  .style.display="none";

  boss.style.display="flex";

  /* Getar jika browser mendukung */
  if(navigator.vibrate){

    navigator.vibrate([
      300,100,300,100,500
    ]);

  }

  setTimeout(() => {

    boss.style.display="none";

    final.style.display="flex";

  },3500);
}

</script>

</body>
</html>
